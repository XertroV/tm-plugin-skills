name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.8"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
      - name: Create pinned Python validation environment
        run: uv venv .venv
      - name: Install pinned Python validation dependencies
        run: uv pip install --python .venv/bin/python --require-hashes -r requirements-validation.lock
      - name: Run repository tests and quick contracts
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python tests/test_validation_entrypoint.py -v
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/validate.py --profile quick
      - name: Validate Agent Skills with pinned skills-ref
        run: |
          for skill in skills/openplanet-*; do
            uvx --from skills-ref==0.1.1 agentskills validate "$skill"
          done
      - name: Install pinned Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.227
      - name: Validate Claude plugin metadata
        run: claude plugin validate . --strict
      - name: Verify exact skill discovery with pinned CLI
        run: npx --yes skills@1.4.1 add . --list
      - name: Reject whitespace errors
        run: git diff --check
